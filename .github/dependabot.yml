version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/pushserver"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/habibots"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/db"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/tools/vice_login_driver"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/tools/log-parser"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/bridge_v2"
    schedule:
      interval: "weekly"
    groups:
      # OpenTelemetry ships its modules as a matched set, and bridge_v2 depends on
      # eight of them. Ungrouped, one release fans out into eight PRs — more than
      # the default open-PR limit of five, so the set arrives PARTIAL and merging
      # what showed up leaves go.mod straddling two otel versions. Worse, every
      # merge to master deploys prod, so a routine bump becomes eight deploys.
      # One PR for the whole family fixes both.
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
